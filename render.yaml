services:
  - type: web
    name: skillgap-backend
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: apps/backend
    envVars:
      - key: MONGODB_URI
        sync: false # Set this to your MongoDB Atlas connection string in the Render Dashboard
      - key: CORS_ORIGINS
        sync: false # Set this to your Vercel deployment URL (e.g. https://your-app.vercel.app) in the Render Dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true # Generates a secure random key for JWT signing
      - key: JWT_REFRESH_SECRET
        generateValue: true # Generates a secure random key for JWT signing
