version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: skillgap-backend
    ports:
      - "4000:4000"
    environment:
      - SERVER_PORT=4000
      - MONGODB_URI=mongodb://mongo:iyAoCQXyGjlwxrRnQgOwWhlcbYogrLcj@caboose.proxy.rlwy.net:10356/skill_gap_analyzer?authSource=admin
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - JWT_ACCESS_SECRET=dev-access-secret-change-in-production-abc123xyz
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production-def456uvw
    restart: always

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:4000/api/v1
        - VITE_GEMINI_API_KEY=your_api_key_here
    container_name: skillgap-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
